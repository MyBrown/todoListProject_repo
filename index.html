<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>

    <link 
        rel = "stylesheet"
        href = "./style.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    <h1>To-do List</h1>
    <div>
        <div class = "add section">
            <!-- <div class="clear">
                <p>Clear List</p>
            </div> -->
            <input id="task" placeholder="Task title..." type="text">
            <input id="due-date" type="date">
            <div class="add task">
                <p><img class="plus sign" src="./assets/mono-svn-add.svg"/>Add Task</p>
            </div> 
        </div>
        <div id="list-body">
            <div id="overdue">
                <h2>Overdue<span class="clear" id="overdue-clear">Clear</span></h2> 
                <ul id="overdue-list">
                    
                </ul>
            </div>
            <div class="today">
                <h2>Today<span class="clear" id="today-clear">Clear</span></h2>
                <ul id="today-list">
                </ul>
            </div>
            <div id="tomorrow">
                <h2>Tomorrow<span class="clear" id="tomorrow-clear">Clear</span></h2> 
                <ul id="tomorrow-list">
                    
                </ul>
            </div>
            <div class="this-week">
                <h2>This Week<span class="clear" id="week-clear">Clear</span></h2>
                <ul id="week-list">

                </ul>
            </div>
            <div class="future">
                <h2>Future<span class="clear" id="future-clear">Clear</span></h2>
                <ul id="future-list">

                </ul>
            </div>
        </div>
    </div>
    
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./index.js" charset="utf-8"></script>
</body>
</html>
